name: cicd full stack app

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
permissions:
  contents: read
  id-token: write

jobs:
  Test-and-scan:
    name: Test & Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      # checkcode backend
      - name: check backend code
        run: npm ci
        working-directory: ./backend
      - name: Run backend tests
        run: npm test
        working-directory: ./backend
      # checkcode frontend
      - name: check frontend code
        run: npm ci
        working-directory: ./frontend
      - name: Run frontend tests
        run: npm test
        working-directory: ./frontend

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=buicongthanh861_Task-Manager
            -Dsonar.organization=java-woof
            -Dsonar.host.url=https://sonarcloud.io
      
      - name: Sonar Cloud Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      
      - name: Synk Scan
        uses: snyk/actions@master
        continue-on-error: true
        timeout-minutes: 5
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: test --all-projects --severity-threshold=high
  
  Docker-build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: Test-and-scan
    timeout-minutes: 20
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}  

      - name: build and push docker image frontend
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: |
            congthanh19/taskmanager-frontend:${{ github.sha }}
            congthanh19/taskmanager-frontend:latest
          build-args: |
            VITE_API_URL=http://api.local/api
          cache-from: type=gha
          cache-to: type=gha,mode=max
      
      - name: build and push docker image backend
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            congthanh19/taskmanager-backend:${{ github.sha }}
            congthanh19/taskmanager-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
  Gitops-deploy:
    name: Deploy to GitOps
    runs-on: ubuntu-latest
    needs: Docker-build
    timeout-minutes: 20
    steps:
      - name: checkout code
        uses: actions/checkout@v4
        with:
          repository: buicongthanh861/Taskmanager-infra
          token: ${{ secrets.FULLSTACK_DEPLOY_TOKEN }}
          path: Taskmanager-infra
      
      - name: Debug repo
        run: |
          set -euxo pipefail

          echo "Current directory:"
          pwd

          echo "List files:"
          ls -la

          echo "Infra repo files:"
          ls -la Taskmanager-infra

          echo "Current branch:"
          cd Taskmanager-infra
          git branch
      - name: Show values before update
        run: |
          echo "=== FRONTEND BEFORE ==="
          cat Taskmanager-infra/k8s/frontend/values.yaml

          echo "=== BACKEND BEFORE ==="
          cat Taskmanager-infra/k8s/backend/values.yaml  
      - name: setup yqcli
        run: | 
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/bin/yq
          sudo chmod +x /usr/bin/yq
      
      - name: Check yq
        run: yq --version
      
      - name: update k8s deployment file
        run: |
          yq e -i ".container.tag = \"congthanh19/taskmanager-frontend:${GITHUB_SHA}\"" Taskmanager-infra/k8s/frontend/values.yaml
          yq e -i ".container.tag = \"congthanh19/taskmanager-backend:${GITHUB_SHA}\"" Taskmanager-infra/k8s/backend/values.yaml
      
      - name: Show values after update
        run: |
          echo "=== FRONTEND AFTER ==="
          cat Taskmanager-infra/k8s/frontend/values.yaml

          echo "=== BACKEND AFTER ==="
          cat Taskmanager-infra/k8s/backend/values.yaml
      
      - name: Git diff
        run: |
          cd Taskmanager-infra
          
          echo "Git status:"
          git status
          echo "Git diff:"
          git diff
      - name: Commit and Push changes
        run: |
          cd Taskmanager-infra
          git config --global user.email "github-actions@github.com"
          git config --global user.name "github-actions"
          git add .
          git commit -m "chore: update image tags to ${{ github.sha }} [skip ci]"
          git push origin main

    

